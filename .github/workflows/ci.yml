name: TIKSE TECH CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: ci-only-session-secret-not-for-production
      USE_LOCAL_STORE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Regenerate the optional-dependency lock entries with the same npm runtime
      # used for this build, then verify a clean install from that lock.
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
